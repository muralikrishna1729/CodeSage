name: codesage-prod

# Production stack: Qdrant + FastAPI backend + Streamlit frontend.
services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build: .
    command: uvicorn app.api.routes:app --host 0.0.0.0 --port 8010
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REPOS_DIR: /data/repos
      JOB_DB_PATH: /app/data/codesage_jobs.sqlite3
    volumes:
      - repos_data:/data/repos
      - jobs_data:/app/data
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build: .
    command: streamlit run app/frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      API_URL: http://backend:8010
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  repos_data:
  jobs_data:
