# Production stack: Qdrant + FastAPI backend + Streamlit frontend.
# Usage:
#   cp .env.example .env   # fill in your API keys first
#   docker compose -f docker-compose.prod.yml up -d --build
# (the dev-only docker-compose.yml that runs just Qdrant is untouched)
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build: .
    command: uvicorn app.api.routes:app --host 0.0.0.0 --port 8010
    env_file: .env
    environment:
      # real env vars take precedence over the .env file (pydantic-settings)
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REPOS_DIR: /data/repos
    volumes:
      - repos_data:/data/repos
    ports:
      - "8010:8010"   # remove if only the frontend should be public
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build: .
    command: streamlit run app/frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      # Streamlit calls the backend server-side (requests), so the internal
      # compose hostname works — no need to expose the backend publicly.
      API_URL: http://backend:8010
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  repos_data: